app:
  description: 输入三个不搭界的词，AI 续写一章「离谱宇宙」；世界观、人物与伏笔经 HTTP 写入 PowerContext，下一轮（含新会话）自动接上。
  icon: 🪐
  icon_background: '#E0F2FE'
  mode: advanced-chat
  name: 离谱宇宙·接龙冒险
  use_icon_as_answer_icon: false
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables:
  - description: PowerContext 服务地址（默认本地 loopback，云端 Dify 需换成公网地址）
    id: 5f1b2c3d-0001-4a5b-8c9d-000000000001
    name: POWERCONTEXT_BASE_URL
    selector:
    - env
    - POWERCONTEXT_BASE_URL
    value: http://127.0.0.1:8000
    value_type: string
  - description: 该宇宙的 scope_id，必须用 scope create 返回的 scp_... 值
    id: 5f1b2c3d-0002-4a5b-8c9d-000000000002
    name: POWERCONTEXT_SCOPE_ID
    selector:
    - env
    - POWERCONTEXT_SCOPE_ID
    value: ''
    value_type: string
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '说出三个完全不搭界的词（例如：电梯、榴莲、前任），我把它们写成这个宇宙的第一章。'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 电梯、榴莲、前任
    - 泡面、月亮、广场舞
    - 扫地机器人、寺庙、炒股
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
