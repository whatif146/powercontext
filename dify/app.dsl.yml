          max_length: 64
          required: true
          type: text-input
          variable: words
      height: 90
      id: '1758000000001'
      position:
        x: 30
        y: 330
      positionAbsolute:
        x: 30
        y: 330
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - key: scope_id
            type: text
            value: '{{#env.POWERCONTEXT_SCOPE_ID#}}'
          - key: query
            type: text
            value: 离谱宇宙 宇宙档案
          type: json
        desc: POST /v1/memory/search 取回该宇宙最近的章节存档
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        selected: false
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: 读取宇宙记忆
        type: http-request
        url: '{{#env.POWERCONTEXT_BASE_URL#}}/v1/memory/search'
        variables: []
      height: 110
      id: '1758000000002'
      position:
        x: 334
        y: 330
      positionAbsolute:
        x: 334
        y: 330
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          def main(raw):
              import json

              try:
                  data = json.loads(raw) if isinstance(raw, str) else (raw or {})
                  hits = (data or {}).get("hits") or []
              except Exception:
                  return {"memory_text": "", "has_memory": 0}

              lines = []
              for h in hits[:5]:
                  text = (h.get("text") or h.get("content") or "").strip()
                  if text:
                      lines.append(text)
              if not lines:
                  return {"memory_text": "", "has_memory": 0}
              return {"memory_text": "\n\n---\n\n".join(lines), "has_memory": 1}
        code_language: python3
        desc: 把检索结果压成纯文本；解析失败或空结果时明确标记“没有既有设定”
        outputs:
          memory_text:
            children: null
            type: string
          has_memory:
            children: null
            type: number
        selected: false
        title: 整理记忆
        type: code
        variables:
        - value_selector:
          - '1758000000002'
          - body
          variable: raw
      height: 54
      id: '1758000000003'
      position:
        x: 638
        y: 330
      positionAbsolute:
        x: 638
        y: 330
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: '='
            id: 0b7f3a1c-2d54-4e88-9b0a-6c1d2e3f4a01
            value: '1'
            varType: number
            variable_selector:
            - '1758000000003'
            - has_memory
          id: 'true'
          logical_operator: and
        desc: 有存档就接着写，没有就开第一章（不假装记得）
        selected: false
